<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Eranga Ranasinghe, Embedded Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283a"/>
      <stop offset="1" stop-color="#1f3a4f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2f5068"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#dots)" opacity=".6"/>

  <!-- PCB traces on the right -->
  <g fill="none" stroke="#3fb68b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M1200 60 H1040 L1010 90 H900"/>
    <path d="M1200 110 H1080 L1050 140 H960"/>
    <path d="M1200 190 H1060 L1030 160 H960"/>
    <path d="M1200 240 H1020 L990 210 H900"/>
    <path d="M760 300 V260 L790 230 H860"/>
    <path d="M820 0 V40 L850 70 H900"/>
  </g>
  <g fill="#16283a" stroke="#3fb68b" stroke-width="3">
    <circle cx="900" cy="90" r="7"/>
    <circle cx="960" cy="140" r="7"/>
    <circle cx="960" cy="160" r="7"/>
    <circle cx="900" cy="210" r="7"/>
    <circle cx="860" cy="230" r="7"/>
    <circle cx="900" cy="70" r="7"/>
  </g>

  <!-- chip -->
  <g>
    <g stroke="#c9d6df" stroke-width="4" stroke-linecap="round">
      <path d="M745 105 H725 M745 130 H725 M745 155 H725 M745 180 H725 M745 205 H725"/>
      <path d="M875 105 H895 M875 130 H895 M875 155 H895 M875 180 H895 M875 205 H895"/>
      <path d="M770 85 V65 M795 85 V65 M820 85 V65 M845 85 V65"/>
      <path d="M770 225 V245 M795 225 V245 M820 225 V245 M845 225 V245"/>
    </g>
    <rect x="745" y="85" width="130" height="140" rx="8" fill="#0f1d29" stroke="#c9d6df" stroke-width="2"/>
    <circle cx="762" cy="102" r="5" fill="#3fb68b"/>
    <text x="810" y="160" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#c9d6df">MCU</text>
    <text x="810" y="184" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7f97a8">ER-2026</text>
  </g>

  <!-- text -->
  <text x="64" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Eranga Ranasinghe</text>
  <text x="66" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#3fb68b">Embedded Systems Engineer</text>
  <text x="66" y="222" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#9fb3c2">PCB design · RTOS firmware · IoT · agri-tech</text>
